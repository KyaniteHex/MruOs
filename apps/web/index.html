<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f2" />
    <title>MruOS</title>
    <script>
      // The saved theme, applied before the first paint (see src/theme.ts).
      (function () {
        var theme = 'system';
        try {
          theme = localStorage.getItem('mruos-theme') || 'system';
        } catch (error) {}
        var dark =
          theme === 'dark' ||
          (theme === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
